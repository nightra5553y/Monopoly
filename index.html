<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly we move</title>
    <script src="game.js" defer></script>
</head>
<body>
    <h1>CashUp (name TBC)</h1>

    <button id = "PlayerNum"> Add Player</button>
    <div id = "inputName" hidden>
        <input type="text" id="userName">
        <button id = "GetName">Submit</button>
    </div>


    
    
    <p>Current Player: <span id="playerName">Player 1</span></p>
    <p>Dice Roll: <span id = "DiceRoll"> Roll </span></p>
    <p>Position: <span id = "pos"> Start </span></p>

    <button id = "Dice">Roll Dice</button>
    <p>Name of position: <span id = "name"> Name </span></p>
    <p>Owner of position: <span id = "owner"> Owner </span></p>
    <p>Remaining Money: <span id = "budget"> Budget </span></p>


    <button id="Buy" hidden>
        Buy Property
    </button>

    <p>Properties: <span id = "props"> Owned Properties </span></p>


    <button id="End">End Turn</button>
</body>
</html>
